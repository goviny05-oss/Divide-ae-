      <stop offset="0" stop-color="#8a6cf2"/>
      <stop offset="0.55" stop-color="#6d5ef0"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.22" r="0.95">
