  <g stroke="#ffffff" stroke-width="34" stroke-linecap="round" fill="none">
    <line x1="132" y1="206" x2="380" y2="206"/>
    <line x1="132" y1="296" x2="380" y2="296"/>
    <line x1="132" y1="386" x2="256" y2="386"/>
